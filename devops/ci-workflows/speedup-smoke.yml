name: Smoke Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  smoke:
    name: 🧪 Compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧬 Compile all sources
        run: |
          echo "🧪 Compiling speedup sources..."
          python -m compileall -q agent backend cli config gui widgets
          echo "✅ All sources compile."
