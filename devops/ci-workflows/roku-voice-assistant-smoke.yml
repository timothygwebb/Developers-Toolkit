name: Smoke Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: 🧪 Voice assistant test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧬 Run tests
        run: |
          echo "🧪 Running roku-voice-assistant tests..."
          python -m pytest tests/ -q
          echo "✅ Smoke test complete."
